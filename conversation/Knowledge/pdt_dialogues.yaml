meta:
  dataset_name: PDT Dialogues Bidirectional
  version: '1.0'
  purpose: Paired bidirectional roleplay dataset derived from the expanded PDT dialogues. Each item supports
    both student-simulator generation and PDT-response generation.
  source_file: pdt_dialogues_expanded.yaml
  notes:
  - Built from the expanded PDT dialogue set.
  - Each record contains both a student-facing opening and a PDT-facing response target.
  - Useful for DeepSeek prompting, student simulation, PDT response generation, Furhat testing, and evaluation.
records:
- dialogue_id: dlg_001
  split: train
  mode: standard_roleplay
  primary_intent: ask_find_pdt
  risk_level: low
  format: paired_dialogue
  student_prompt: I do not know who my PDT is.
  pdt_response_target: You can usually find your PDT in Moodle or your eStudent record. If it is not listed
    there, contact your Programme Leader or School Office.
  reverse_student_simulation_target: I do not know who my PDT is.
  full_turns:
  - role: student
    text: I do not know who my PDT is.
  - role: pdt
    text: You can usually find your PDT in Moodle or your eStudent record. If it is not listed there,
      contact your Programme Leader or School Office.
  pdt_response_examples:
  - context: []
    student_input: I do not know who my PDT is.
    target_pdt_response: You can usually find your PDT in Moodle or your eStudent record. If it is not
      listed there, contact your Programme Leader or School Office.
  student_simulation_examples:
  - context: []
    pdt_context_or_prompt: You can usually find your PDT in Moodle or your eStudent record. If it is not
      listed there, contact your Programme Leader or School Office.
    target_student_input: I do not know who my PDT is.
