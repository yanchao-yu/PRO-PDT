pdt_guidance:
  how_to_find_your_pdt:
  - Check Moodle.
  - Check eStudent Records.
  - If not available, contact your Programme Leader or School Office.
  student_expectations:
    meeting_frequency_guidance: Meet regularly, ideally once per academic trimester.
    response_time_target: PDTs should aim to respond within three working days.
    confidentiality: Your PDT should keep discussions confidential unless you give permission to share information or there are concerns about risk to you or others.
    meeting_notes: PDT meeting notes are kept confidential and can be viewed on the e:Student portal by you and your current PDT.
  your_pdt_will:
  - Introduce themselves in your first few weeks and meet with you throughout your time at university.
  - Help you reflect on personal and professional development.
  - Review academic progress and offer constructive feedback on academic skill development.
  - Listen to non-academic concerns.
  - Signpost you to academic, welfare, and wellbeing support within the university.
  - Write an academic reference if required.
  contact_your_pdt_if:
  - You are considering changing course or leaving the university.
  - You are worried about grades or exams.
  - You think a specific learning difficulty may be affecting your studies.
  - Personal problems are affecting your studies.
  - You need a reference for further study or a job.
  your_pdt_cannot:
  - Answer every question; they may need to direct you to specialist support.
  - Provide round-the-clock support.
  - Change grades or appeal exam results for you.
  staff_guidance_summary:
    allocation: Students on most taught programmes should be allocated a PDT.
    proactive_contact: Appointments should be arranged at least twice per year, with the first meeting as soon as possible after the start of teaching.
    minimum_individual_contact: At least one meeting per year should be one-to-one.
    academic_advising:
    - Offer appropriate guidance in relation to studies.
    - Review academic progress.
    - Signpost to Academic Skills and Student Wellbeing and Inclusion where required.
    - Support personal and professional development and signpost to Student Futures.
    record_keeping: Maintain notes of PDT contact.
counselling_and_mental_wellbeing:
  summary: The Counselling and Mental Wellbeing team supports students through their university experience and helps with mental health challenges.
  service_type: Non-crisis service.
  opening_hours: 9am-5pm Monday to Friday, with some early evening appointments available.
  contact:
    email: counselling@napier.ac.uk
    phone: 0131 455 2459
  self_referral:
    required_for_registration: true
    link: https://corenet4.coreims.co.uk/napier/selfreferral/selfreferralstart.aspx
  urgent_support:
    out_of_hours_route: Use Emergency & out of hours wellbeing support.
    concern_about_student:
    - Email counselling@napier.ac.uk
    - Email safeguarding@napier.ac.uk
  services_and_resources:
  - Support and advice for stress, anxiety, and other mental health issues linked to personal circumstances or academic pressures.
  - Resources and coping strategies including workshops, videos, breathing exercises, and grounding techniques.
  - Online support with Togetherall.
  - Guidance for experiencing suicidal thoughts or feelings.
togetherall:
  summary: Free, anonymous, online support for Edinburgh Napier students who are struggling, stressed, low, unable to cope, or want help managing wellbeing.
  availability: 24/7 online community with professional support from trained counsellors.
  key_features:
  - Anonymous use.
  - Peer-to-peer community support.
  - Structured self-help courses.
  - Private journal and goal-setter.
  - Self-assessments and support articles.
  sign_up_steps:
  - Go to togetherall.com and select 'join for free'.
  - Choose 'I'm from a university or college'.
  - Use your university email address.
  - Create an anonymous name.
  support_types:
    community:
    - Post a standalone 'brick' to get things off your chest.
    - Join groups to talk things through with others.
    courses:
    - Depression
    - Social anxiety
    - Stress and worry
    - Procrastination
    - Sleep
    - Assertiveness
    - Grief and loss
    - Quitting smoking
    other_resources:
    - Private journal
    - Goal-setter
    - Self-assessments
    - Support articles
    - External resources
  help_if_sign_up_fails: Email counselling@napier.ac.uk.
