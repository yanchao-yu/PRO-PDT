exam_results_and_decision_codes:
  results_publication_dates_2026:
    trimester_1: 9 February 2026
    trimester_2: 30 June 2026
    reassessment: 31 August 2026
    trimester_3: 9 October 2026
  general_notes:
  - Results can also be viewed on eStudent records together with programme and module results.
  - 'Taught Master''s programmes have two decision-code tables: up to 2024/25 used a grading scale, while 2025/26 onwards uses percentage marking.'
  - Marks seen before official publication are indicative only until ratified by the Programme Assessment Board.
  undergraduate_module_codes:
    M: Merit pass; overall module mark at least 65%; module complete.
    P: Pass; module complete.
    AP: Assessment pass for a component; check overall module result.
    AF: Assessment fail for a component; reassessment required.
    CP: Compensatory pass; credit awarded and no reassessment required.
    RP: Repeat module with attendance next academic year.
    EA: Exceptional attempt; one more attempt allowed.
    EX: Extenuating circumstances; assessment may be taken at next opportunity; first-attempt passes are not capped, second-attempt passes are capped at 40%.
    ER: Emergency regulation; next opportunity available; first-attempt passes are not capped, second-attempt passes are capped at 40%.
    F: Reassessment / fail; module not successfully completed.
    QF: Qualified fail; one component failed.
    NA: No result available; at least one component not completed.
  taught_masters_module_codes_2025_26_onwards:
    D: Distinction; overall mark at least 70%; module complete.
    M: Merit; overall mark at least 60%; module complete.
    P: Pass; module complete.
    AP: Assessment pass for a component; check overall module result.
    AF: Assessment fail for a component; reassessment required.
    CP: Compensatory pass; credit awarded and no reassessment required.
    RP: Repeat module with attendance.
    EA: Exceptional attempt; one more attempt allowed.
    EX: Extenuating circumstances; first-attempt passes not capped, second-attempt passes capped at 50%.
    ER: Emergency regulations; first-attempt passes not capped, second-attempt passes capped at 50%.
    F: Fail.
    QF: Qualified fail; one component failed.
    NA: No result available; one or both assessment components not completed.
  taught_masters_module_codes_up_to_2024_25:
    D1-D5: Distinction pass; module complete.
    P1-P5: Pass; module complete.
    AP: Assessment pass for a component; check overall module result.
    AF: Assessment fail for a component; reassessment required.
    CP: Compensatory pass; credit awarded and no reassessment required.
    RP: Repeat module with attendance.
    EA: Exceptional attempt; one more attempt allowed.
    EX: Extenuating circumstances; first-attempt passes not capped at P1, second-attempt passes capped at P1.
    ER: Emergency regulations; first-attempt passes not capped at P1, second-attempt passes capped at P1.
    F1-F5: Fail; if initial attempt, maximum reassessment result is P1.
    F6: Non submission; no further reassessment if this was the second attempt.
    QF: Qualified fail; one component failed.
    NA: No result available; one or both components not completed.
  if_results_look_incorrect:
    guidance: Contact your Programme Leader or PDT and your School Office as soon as possible.
    school_offices:
      School of Applied Science: sas.admin@napier.ac.uk
      School of Arts & Creative Industries: saci@napier.ac.uk
      School of Computing, Engineering and the Built Environment: scebeschooloffice@napier.ac.uk
      School of Health & Social Care: shsc.admin@napier.ac.uk
      The Business School: passtbs@napier.ac.uk
      Doctoral College: doctoralcollegeoffice@napier.ac.uk
  wellbeing_after_results:
  - Use university counselling and single-session therapy services.
  - Use Togetherall for free 24/7 anonymous online support.
  - Use ENSA Advice for independent support and advice.
  - Use emergency and out-of-hours wellbeing support when the university is closed.
