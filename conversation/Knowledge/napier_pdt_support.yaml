    opening_hours: 24 hours a day
    contact:
      telephone: '111'
  - name: Nightline
    service: Confidential telephone and instant messaging helpline run by students for students.
    opening_hours: During term time, 8pm-8am
    contact:
      telephone: 0131 557 4444
      website: www.ednightline.com
  - name: Samaritans
