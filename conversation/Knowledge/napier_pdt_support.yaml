    opening_hours: 24 hours a day
    contact:
      telephone: 116 123
      email: jo@samaritans.org
      website: www.samaritans.org
  - name: Saneline
    service: Confidential helpline for emotional support or information for anyone with mental health issues.
    opening_hours: 6pm-11pm, 7 days a week
    contact:
      telephone: 0300 304 7000
      email: info@sane.org.uk
      website: www.sane.org.uk
  - name: Victim Support
    service: Confidential helpline for anyone affected by crime.
    opening_hours: Scottish Helpline Mon-Fri 8am-8pm; UK Helpline Mon-Fri 9am-9pm and Sat-Sun 9am-7pm
    contact:
      telephone: 0845 30 30 900
