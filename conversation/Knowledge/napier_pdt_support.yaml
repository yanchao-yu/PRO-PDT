    service: Online mental wellbeing courses designed by clinical experts and supported by the NHS and Scottish Government.
    access_note: Use access code NHS24 on first visit.
    website: https://wellbeing.silvercloudhealth.com/signup/
  - name: Abused Men in Scotland
