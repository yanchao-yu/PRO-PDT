    opening_hours: Mon-Thu 6pm-2am; Fri-Mon 6pm-6am
    contact:
      telephone: 0800 83 85 87
      email: info@breathingspacescotland.co.uk
      website: www.breathingspace.scot
  - name: Edinburgh Crisis Centre
    service: 24 hour crisis helpline for those with mental health issues; provides booked appointments.
    opening_hours: 24 hours a day
    contact:
      freephone: 0808 801 0414
      text: 07974 429 075
      email: crisis@edinburghcrisiscentre.org.uk
      website: www.edinburghcrisiscentre.org.uk
  - name: Edinburgh Rape Crisis Centre
    service: Helpline for anyone affected by sexual violence.
    opening_hours: 6pm-12pm, 7 days a week
    contact:
      telephone: 0808 801 302
      email: support@ercc.scot
      website: www.ercc.scot
  - name: Hopeline 247
